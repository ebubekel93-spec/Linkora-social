name: Search Service CI

on:
  push:
    branches:
      - main
    paths:
      - "services/search/**"
      - ".github/workflows/search-ci.yml"
  pull_request:
    paths:
      - "services/search/**"
      - ".github/workflows/search-ci.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: services/search
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    # Only runs after lint passes to fail fast on lint errors first
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        working-directory: services/search
        run: pnpm typecheck

  test:
    name: Unit & FTS Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linkora
          POSTGRES_PASSWORD: linkora
          POSTGRES_DB: linkora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://linkora:linkora@localhost:5432/linkora_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (unit + FTS integration)
        working-directory: services/search
        run: pnpm test
        env:
          CI: true
          DATABASE_URL: ${{ env.DATABASE_URL }}
